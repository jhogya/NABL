<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>League Power Rankings</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #17233d;
    --panel-border: #263454;
    --text: #e6ecfa;
    --text-dim: #93a1c2;
    --accent: #5b8cff;
    --up: #3ddc84;
    --down: #ff5d6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  header p { color: var(--text-dim); margin: 0; font-size: 0.9rem; }

  .week-picker {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .week-picker button {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .week-picker button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b1120;
    font-weight: 600;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin: 0 0 14px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--text-dim); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
  td.num, th.num { text-align: right; }
  .rank { font-weight: 700; color: var(--accent); width: 28px; }
  .move-up { color: var(--up); }
  .move-down { color: var(--down); }
  .move-flat { color: var(--text-dim); }

  .recap-lines, .recap-text { margin: 0; padding-left: 18px; color: var(--text-dim); line-height: 1.6; }
  .recap-text { padding-left: 0; white-space: pre-wrap; }

  .award-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .award-grid { grid-template-columns: 1fr; } }
  .award-card {
    background: #101b33;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .award-card .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin-bottom: 4px; }
  .award-card .value { font-size: 0.95rem; }
  .award-card .value .score { color: var(--accent); font-weight: 600; }

  .pos-tag {
    display: inline-block;
    font-size: 0.7rem;
    color: var(--text-dim);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 1px 5px;
    margin-right: 6px;
  }
  .delta-neg { color: var(--down); }

  .meta { color: var(--text-dim); font-size: 0.8rem; text-align: center; margin-top: 10px; }
  .error, .loading { text-align: center; color: var(--text-dim); padding: 40px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🏈 League Power Rankings</h1>
      <p>Updated automatically after Monday Night Football each week</p>
    </header>

    <div id="week-picker" class="week-picker"></div>
    <div id="content" class="loading">Loading rankings…</div>
  </div>

  <script>
    let history = [];
    let selectedWeek = null;

    async function load() {
      const contentEl = document.getElementById('content');
      try {
        const res = await fetch('/.netlify/functions/get-rankings');
        if (!res.ok) throw new Error('Failed to load rankings (' + res.status + ')');
        const data = await res.json();

        history = data.history || [];
        if (!history.length) {
          contentEl.innerHTML = '<div class="error">No rankings yet. Trigger a manual refresh to generate the first snapshot.</div>';
          return;
        }

        history.sort((a, b) => a.week - b.week);
        selectedWeek = history[history.length - 1].week;
        renderWeekPicker();
        renderSnapshot(getSnapshot(selectedWeek));
      } catch (err) {
        contentEl.innerHTML = '<div class="error">' + err.message + '</div>';
      }
    }

    function getSnapshot(week) {
      return history.find((h) => h.week === week);
    }

    function renderWeekPicker() {
      const picker = document.getElementById('week-picker');
      picker.innerHTML = history
        .map(
          (h) =>
            `<button data-week="${h.week}" class="${h.week === selectedWeek ? 'active' : ''}">Week ${h.week}</button>`
        )
        .join('');

      picker.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedWeek = Number(btn.dataset.week);
          renderWeekPicker();
          renderSnapshot(getSnapshot(selectedWeek));
        });
      });
    }

    function movementCell(t) {
      if (!t.prevRank || t.movement === 0) return '<span class="move-flat">–</span>';
      if (t.movement > 0) return '<span class="move-up">▲ ' + t.movement + '</span>';
      return '<span class="move-down">▼ ' + Math.abs(t.movement) + '</span>';
    }

    function rankingsTable(snapshot) {
      const rows = snapshot.rankings
        .map(
          (t) => `
        <tr>
          <td class="rank">${t.rank}</td>
          <td>${t.name}</td>
          <td class="num">${t.wins}-${t.losses}${t.ties ? '-' + t.ties : ''}</td>
          <td class="num">${t.pointsFor.toFixed(1)}</td>
          <td class="num">${movementCell(t)}</td>
        </tr>`
        )
        .join('');

      return `
        <div class="panel">
          <h2>Power Rankings</h2>
          <table>
            <thead><tr><th>#</th><th>Team</th><th class="num">Record</th><th class="num">PF</th><th class="num">Move</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function awardsSection(snapshot) {
      const awards = snapshot.matchupAwards;
      if (!awards || !awards.matchups || !awards.matchups.length) return '';

      const closest = awards.closestGame;
      const blowout = awards.biggestBlowout;

      return `
        <div class="panel">
          <h2>Matchup Awards — Week ${snapshot.recapWeek || snapshot.week}</h2>
          <div class="award-grid">
            <div class="award-card">
              <div class="label">Closest Game</div>
              <div class="value">${closest.awayTeam} <span class="score">${closest.awayScore.toFixed(1)}</span> @ ${closest.homeTeam} <span class="score">${closest.homeScore.toFixed(1)}</span><br>margin: ${closest.margin.toFixed(1)}</div>
            </div>
            <div class="award-card">
              <div class="label">Biggest Blowout</div>
              <div class="value">${blowout.winner} <span class="score">${blowout.winnerScore.toFixed(1)}</span> over ${blowout.loser} <span class="score">${blowout.loserScore.toFixed(1)}</span><br>margin: ${blowout.margin.toFixed(1)}</div>
            </div>
          </div>
        </div>`;
    }

    function performersSection(snapshot) {
      if (!snapshot.topPerformers || !snapshot.topPerformers.length) return '';

      const rows = snapshot.topPerformers
        .map(
          (p) => `
        <tr>
          <td><span class="pos-tag">${p.position}</span>${p.name}</td>
          <td>${p.team}</td>
          <td class="num">${p.actual.toFixed(1)}</td>
        </tr>`
        )
        .join('');

      return `
        <div class="panel">
          <h2>Top 5 Performances — Week ${snapshot.recapWeek || snapshot.week}</h2>
          <table>
            <thead><tr><th>Player</th><th>Team</th><th class="num">Points</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function bustsSection(snapshot) {
      if (!snapshot.busts || !snapshot.busts.length) return '';

      const rows = snapshot.busts
        .map(
          (p) => `
        <tr>
          <td><span class="pos-tag">${p.position}</span>${p.name}</td>
          <td>${p.team}</td>
          <td class="num">${p.actual.toFixed(1)}</td>
          <td class="num">${p.projected.toFixed(1)}</td>
          <td class="num delta-neg">${p.delta.toFixed(1)}</td>
        </tr>`
        )
        .join('');

      return `
        <div class="panel">
          <h2>Top 5 Disappointments — Week ${snapshot.recapWeek || snapshot.week}</h2>
          <table>
            <thead><tr><th>Player</th><th>Team</th><th class="num">Actual</th><th class="num">Projected</th><th class="num">Diff</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    function recapSection(snapshot) {
      if (snapshot.aiRecap) {
        return `
          <div class="panel">
            <h2>Weekly Recap</h2>
            <div class="recap-text">${snapshot.aiRecap}</div>
          </div>`;
      }

      const lines = (snapshot.recapLines || []).map((l) => `<li>${l}</li>`).join('');
      return `
        <div class="panel">
          <h2>Weekly Recap</h2>
          <ul class="recap-lines">${lines || '<li>No recap yet.</li>'}</ul>
        </div>`;
    }

    function renderSnapshot(snapshot) {
      const contentEl = document.getElementById('content');
      if (!snapshot) {
        contentEl.innerHTML = '<div class="error">No data for that week.</div>';
        return;
      }

      contentEl.innerHTML = [
        rankingsTable(snapshot),
        awardsSection(snapshot),
        performersSection(snapshot),
        bustsSection(snapshot),
        recapSection(snapshot),
        `<div class="meta">Generated ${new Date(snapshot.generatedAt).toLocaleString()}</div>`,
      ].join('');
    }

    load();
  </script>
</body>
</html>
